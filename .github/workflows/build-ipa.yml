name: Build FS01 Remote IPA

on:
  push:
    branches: [main]
    paths:
      - 'FS01Remote/**'
      - 'FS01Remote.xcodeproj/**'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Build for physical iPhone
        run: |
          xcodebuild -version
          xcodebuild \
            -project FS01Remote.xcodeproj \
            -scheme FS01Remote \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/fs01-build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package and verify IPA
        run: |
          app="$RUNNER_TEMP/fs01-build/Build/Products/Release-iphoneos/FS01Remote.app"
          test -x "$app/FS01Remote"
          /usr/libexec/PlistBuddy -c 'Print :NSBluetoothAlwaysUsageDescription' "$app/Info.plist"
          lipo "$app/FS01Remote" -verify_arch arm64
          mkdir -p dist/Payload
          ditto "$app" dist/Payload/FS01Remote.app
          cd dist
          zip -qry FS01Remote.ipa Payload
          unzip -tq FS01Remote.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: FS01Remote
          path: dist/FS01Remote.ipa
          if-no-files-found: error
          compression-level: 0
